services:
  db:
    image: postgres:16-alpine
    container_name: activofijo-db
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: activofijo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - activofijo-db-data:/var/lib/postgresql/data
      - ./scripts/01-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    networks:
      - activofijo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d activofijo"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: activofijo-core
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE:-fresh}
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL}
      LEGACY_DATABASE_URL: ${LEGACY_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-uagrm_super_secure_jwt_access_secret_key_32_chars_minimum!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - activofijo-net

networks:
  activofijo-net:
    name: activofijo-net
    driver: bridge

volumes:
  activofijo-db-data:
